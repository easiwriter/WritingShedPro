name = "wsp-support"
main = "src/index.js"
compatibility_date = "2024-01-01"
workers_dev = true

[[r2_buckets]]
binding = "TUTORIAL_VIDEOS"
bucket_name = "wsp-videos"

# Configure for messages API (required for /api/messages and /api/admin/messages)
[[d1_databases]]
binding = "MESSAGES_DB"
database_name = "wsp_messages"
database_id = "8c142ac0-e616-44a9-8973-f288e44c1d37"

# Cloudflare sync POC bindings. These are used only by /api/sync/v1/* routes.
[[d1_databases]]
binding = "SYNC_DB"
database_name = "wsp_sync_poc"
database_id = "0e59e874-c89d-4175-ab77-5bcabf430c54"

[[r2_buckets]]
binding = "SYNC_BLOBS"
bucket_name = "wsp-sync-poc"

[[rules]]
type = "Text"
globs = ["**/*.txt"]
fallthrough = true

# The LLM_API_KEY and SYSTEM_PROMPT are stored as secrets:
#   npx wrangler secret put LLM_API_KEY
#   npx wrangler secret put SYSTEM_PROMPT
#
# The sync POC token is stored as a secret when the POC endpoints are enabled:
#   npx wrangler secret put SYNC_POC_TOKEN
#
# Or SYSTEM_PROMPT can be set as a plain-text variable here if preferred:
# [vars]
# SYSTEM_PROMPT = "..."
