<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing Shed Pro Guide</title>
    <style>body { 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    max-width: 800px;
    margin: 40px auto;
    padding: 20px;
    line-height: 1.6;
    color: #333;
}
h1, h2, h3, h4, h5, h6 { margin-top: 1.5em; margin-bottom: 0.5em; }
h1 { font-size: 2em; border-bottom: 1px solid #eee; padding-bottom: 0.3em; }
h2 { font-size: 1.5em; border-bottom: 1px solid #eee; padding-bottom: 0.3em; }
code { background: #f4f4f4; padding: 2px 6px; border-radius: 3px; font-family: monospace; }
pre { background: #f4f4f4; padding: 16px; border-radius: 6px; overflow-x: auto; }
pre code { background: none; padding: 0; }
blockquote { border-left: 4px solid #ddd; margin-left: 0; padding-left: 16px; color: #666; }
table { border-collapse: collapse; width: 100%; margin: 1em 0; }
th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
th { background: #f4f4f4; font-weight: bold; }
ul, ol { padding-left: 2em; }
a { color: #0066cc; }
hr { border: none; border-top: 1px solid #ddd; margin: 2em 0; }
/* Back to Contents link */
.back-to-top {
    text-align: right;
    font-size: 0.9em;
    margin: 3em 0 0.5em 0;
}
.back-to-top a {
    color: #666;
    text-decoration: none;
}
.back-to-top a:hover {
    color: #0066cc;
    text-decoration: underline;
}
@media (prefers-color-scheme: dark) {
    body { background: #1a1a1a; color: #e0e0e0; }
    code, pre { background: #2d2d2d; }
    th { background: #2d2d2d; }
    th, td { border-color: #444; }
    blockquote { border-color: #555; color: #aaa; }
    h1, h2 { border-color: #444; }
    a { color: #4da3ff; }
    .back-to-top a { color: #999; }
}
/* In-app overrides */
body { margin-top: 0 !important; padding-top: 8px !important; }
body > *:first-child { margin-top: 0 !important; }
.back-nav { margin-bottom: 0.5em; }
.back-nav a { color: #0066cc; text-decoration: none; font-size: 0.95em; }
@media (prefers-color-scheme: dark) {
    .back-nav a { color: #4da3ff; }
}
</style>
</head>
<body>
<p class="back-nav"><a href="guide:00-toc">← Contents</a></p>
<a id="123-legal"></a>

<p>mat</p>

<p class="back-to-top"><a href="guide:00-toc">↑ Back to Contents</a></p>
<hr>
</body>
</html>
